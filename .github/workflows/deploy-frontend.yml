name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'faith_flow/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - name: Clear cache
        run: rm -rf faith_flow/.expo faith_flow/dist

      - name: Install dependencies
        working-directory: faith_flow
        run: npm ci

      - name: Build web
        working-directory: faith_flow
        env:
          EXPO_PUBLIC_API_URL: https://passionate-benevolence-production-9c5e.up.railway.app
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx expo install --check
          npx expo export --platform web

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./faith_flow/dist