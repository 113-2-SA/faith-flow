version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: faith-flow-db
    restart: always
    environment:
      POSTGRES_USER: faithuser
      POSTGRES_PASSWORD: faith2024
      POSTGRES_DB: faithflowdb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faithuser -d faithflowdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: faith_db_v2